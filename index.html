<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuirkCart - Home</title>
    
    <link rel="icon" type="image/png" href="./assets/images/logo.jpeg" />

    <!-- ✅ Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              ebony: "#3d393b",
              orchid: "#7e1e80",
              purplex: "#9505e3",
              violetx: "#b637fb",
            },
          },
        },
      };
    </script>

    <!-- ✅ JavaScript Files -->
    <script type="module" src="./src/common/appName.js" defer></script>
    <script type="module" src="./src/home/home.js" defer></script>
    <script type="module" src="./utiles/themeUtils.js" defer></script>
  </head>

  <body
    class="bg-white text-ebony dark:bg-gray-900 dark:text-gray-100 flex flex-col min-h-screen font-sans transition-colors duration-500"
  >
    <!-- 🔹 Navbar -->
    <nav
      class="bg-purplex dark:bg-gray-800 text-white shadow-md sticky top-0 z-50 flex justify-between items-center px-6 py-4"
    >
      <div class="flex items-center gap-3">
        <img
          src="./assets/images/logo.jpeg"
          alt="Logo"
          class="w-10 h-10 rounded-full border-2 border-white/80 object-cover"
        />
        <h1 class="text-2xl font-bold tracking-wide">QuirkCart</h1>
        <h1 id="appName" class="text-2xl font-bold tracking-wide"></h1>
      </div>

      <ul class="flex space-x-6 items-center">
        <li>
          <a
            href="./index.html"
            class="text-violetx font-semibold border-b-2 border-violetx pb-1"
            >Home</a
          >
        </li>
        <li><a href="./src/pages/about/about.html" class="hover:text-violetx transition">About</a></li>
        <li><a href="./src/pages/contact/contact.html" class="hover:text-violetx transition">Contact</a></li>
        <li><a href="./src/pages/auth/signin.html" class="hover:text-violetx transition">Signin</a></li>
        <li><a href="./src/pages/auth/signup.html" class="hover:text-violetx transition">Signup</a></li>
        <button
          id="themeToggle"
          class="ml-6 px-4 py-2 bg-white text-purplex rounded-md font-semibold hover:bg-violetx hover:text-white transition"
        >
          🌙 Dark Mode
        </button>
      </ul>
    </nav>

    <!-- 🌟 Hero -->
    <header
      class="relative text-center py-24 bg-gradient-to-r from-[#cc05fa] via-[#fa05b8] to-[#6505fa] text-white overflow-hidden"
    >
      <div class="absolute inset-0 bg-black/10 backdrop-blur-sm"></div>
      <div class="relative z-10">
        <h1
          class="text-6xl font-extrabold mb-4 drop-shadow-lg"
          id="heroTitle"
        >
          QuirkCart
        </h1>
        <p class="text-lg max-w-2xl mx-auto text-white/90 leading-relaxed">
          Explore creativity, innovation, and technology — where design meets
          function beautifully.
        </p>
        <a
          href="#products"
          class="mt-8 inline-block bg-white text-[#6505fa] font-semibold px-8 py-3 rounded-full shadow-md hover:bg-[#fa05b8] hover:text-white transition-transform duration-300 hover:scale-105"
        >
          Start Exploring...
        </a>
      </div>
    </header>

    <!-- 💼 Product Grid Section -->
    <section
      id="products"
      class="container mx-auto px-6 py-16 dark:bg-gray-900 dark:text-gray-100"
    >
      <h2 class="text-4xl font-bold text-center text-[#6505fa] mb-10">
        Product Collection
      </h2>

      <!-- ✅ Cards will be rendered here by JS -->
    </section>

    <!-- 🔹 Footer -->
    <footer class="bg-purplex dark:bg-gray-800 text-white text-center py-5 mt-auto">
      <p>© 2025 QuirkCart — Designed with 💜 and Tailwind CSS</p>
    </footer>
  </body>
</html>
